name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA
        required: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1

      - name: Verify bottle build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          run=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow tests.yml \
            --event pull_request \
            --commit "$HEAD_SHA" \
            --limit 1 \
            --json status,conclusion,url)
          if [[ $(jq -r '.[0].status // empty' <<< "$run") != completed || \
                $(jq -r '.[0].conclusion // empty' <<< "$run") != success ]]; then
            echo "No successful bottle build found for $HEAD_SHA" >&2
            jq . <<< "$run" >&2
            exit 1
          fi

      - name: Pull bottles
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" \
            "$PULL_REQUEST"

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          branch: main

  verify-bottle:
    needs: pr-pull
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install and verify published bottle
        env:
          TAP_PATH: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          test ! -e "$HOME/.lns"
          git -C "$TAP_PATH" fetch origin main
          git -C "$TAP_PATH" checkout --detach FETCH_HEAD
          go_before=$(brew list --versions go 2>/dev/null || true)
          brew install crown-dev-studios/tap/lns
          go_after=$(brew list --versions go 2>/dev/null || true)
          test "$go_after" = "$go_before"
          brew list --formula --poured-from-bottle | grep -qx lns
          brew list --formula caddy >/dev/null
          brew test crown-dev-studios/tap/lns
          lns doctor
          test ! -e "$HOME/.lns"
